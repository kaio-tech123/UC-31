<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
</head>

<body>

    <h1>Editar Livro</h1>

    <form method="POST">

        <label>Título</label><br>
        <input type="text" name="titulo" value="{{ livro.titulo }}" required>

        <br><br>

        <label>Autor</label><br>
        <input type="text" name="autor" value="{{ livro.autor }}" required>

        <br><br>

        <label>Ano de Publicação</label><br>
        <input type="text" name="ano" value="{{ livro.ano }}" required>

        <br><br>

        <label>Categoria</label><br>
        <input type="text" name="categoria" value="{{ livro.categoria }}" required>

        <br><br>

        <label>Quantidade de Exemplares</label><br>
        <input type="number" name="quantidade" value="{{ livro.quantidade }}" required>

        <br><br>

        <button type="submit">
            Salvar Alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('listar') }}">Voltar para a Listagem</a>

</body>

</html>
