{% extends "base.html" %}

{% block title %}Entrar - GamesHub Edu{% endblock %}

{% block content %}
<h1>Entrar</h1>

<form method="post" action="{{ url_for('login') }}" class="formulario">
    <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
    </div>

    <button type="submit" class="botao">Entrar</button>
</form>

<p>Ainda nao tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
{% endblock %}
