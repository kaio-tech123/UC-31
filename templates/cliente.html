<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FoodExpress - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">FoodExpress</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/cardapio">Cardápio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/pedidos">Pedidos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/contato">Contato</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cliente">Cliente</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

    <div class="container mt-5">
        <div class="card p-4 mx-auto" style="max-width: 500px;">
            <h4 class="fw-bold border-bottom pb-2">Dados do Cliente</h4>
            
            <p class="fs-5"><strong>Cliente:</strong> {{ nome }}</p>
            <p class="fs-5"><strong>Cidade:</strong> {{ cidade }}</p>
            
            <div class="mt-3">
                {% if cidade.lower() == 'natal' %}
                    <div class="alert alert-success text-center fw-bold" role="alert">
                        Entrega disponível!
                    </div>
                {% else %}
                    <div class="alert alert-danger text-center fw-bold" role="alert">
                        Entrega indisponível.
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
